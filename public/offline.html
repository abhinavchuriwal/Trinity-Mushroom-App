<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>No connection · Trinity Agro</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      box-sizing: border-box;
      background: #f1f7e9;
      color: #23272b;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      line-height: 1.45;
    }
    .box {
      background: #fff;
      border: 1px solid #d7dcdf;
      border-top: 4px solid #bbd336;
      border-radius: 10px;
      padding: 1.5rem;
      max-width: 22rem;
    }
    h1 { font-size: 1.2rem; margin: 0 0 0.6rem; color: #384f17; }
    p { margin: 0 0 1rem; font-size: 1rem; }
    button {
      width: 100%;
      min-height: 48px;
      border: none;
      border-radius: 6px;
      background: #547722;
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="box">
    <h1>No internet connection</h1>
    <p>The phone can't reach the Trinity Agro server right now.</p>
    <p>Move to where there's signal, then tap Try again. If you were saving a reading, check it shows in the list afterwards &mdash; if it doesn't, enter it again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </div>
</body>
</html>
